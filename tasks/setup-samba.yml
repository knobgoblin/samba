---
- name: Ensure that Samba is installed and up to date
  apt:
    name: samba
    state: latest
  when: not samba_debug

- name: Create Samba configuration directory
  file:
    path: "{{ samba_conf_directory }}"
    state: directory
    owner: "{{ samba_conf_directory_owner }}"
    group: "{{ samba_conf_directory_group }}"
    mode: '0755'

- name: Create Samba configuration file
  template:
    src: smb.conf.j2
    dest: "{{ samba_conf_directory }}/smb.conf"
    owner: "{{ samba_conf_directory_owner }}"
    group: "{{ samba_conf_directory_group }}"
    mode: '0644'

- name: Restart Samba server to consume updated configuration
  service:
    name: "{{ item }}"
    state: restarted
  loop:
    - samba
    - smbd
    - nmbd
  when: not samba_debug
